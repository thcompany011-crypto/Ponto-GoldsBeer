<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Golds Beer | Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933158.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ponto Golds Beer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
    </head>
<body class="pagina-login">
    <div class="login-container">
        <div class="relogio-circulo" id="relogio-login">00:00</div>
        
        <h2 style="color: white; margin-top: 0;">Ponto Golds Beer</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Identifique-se para bater o ponto</p>

        <form id="formLogin">
            <input type="email" id="email" class="form-control" placeholder="E-mail" required>
            <input type="password" id="senha" class="form-control" placeholder="Senha" required>
            <button type="submit" id="btnAcesso" class="btn-autenticar">ENTRAR</button>
            <div id="msgErro" class="msg-erro">E-mail ou senha incorretos.</div>
        </form>

        <div style="margin-top: 25px; font-size: 0.65rem; letter-spacing: 1.5px; color: #475569; font-weight: 500;">
            TH COMPANY DESDE 2026
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
    <script>
        setInterval(() => {
            document.getElementById('relogio-login').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }, 1000);
    </script>
</body>
</html>
