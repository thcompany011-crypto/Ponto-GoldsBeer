<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Golds Beer | Bem-vindo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
 <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f172a">

<!-- PWA -->
<meta name="mobile-web-app-capable" content="yes">

<!-- iPhone / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold's Beer">

<!-- Ícone do aplicativo -->
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (sessionStorage.getItem('ponto-sw-reloaded') === '1') return;
                sessionStorage.setItem('ponto-sw-reloaded', '1');
                window.location.reload();
            });

            window.addEventListener('load', async () => {
                try {
                    const registro = await navigator.serviceWorker.register('./service-worker.js');
                    await registro.update();
                    setTimeout(() => sessionStorage.removeItem('ponto-sw-reloaded'), 5000);
                } catch (erro) {
                    console.error('Erro ao atualizar o sistema:', erro);
                }
            });
        }
    </script>
</head>
<body>
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { app } from "./js/firebase.js";
        onAuthStateChanged(getAuth(app), (user) => {
            window.location.href = user ? "dashboard.html" : "login.html";
        });
    </script>
</body>
</html>
